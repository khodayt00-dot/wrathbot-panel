<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WRATHBOT - تست</title>
<style>
body{background:#111;color:white;font-family:Tahoma;text-align:center;padding:40px 20px}
button{
  display:block;width:100%;max-width:300px;margin:12px auto;
  padding:16px;font-size:18px;background:#ff2222;color:white;
  border:none;border-radius:12px;cursor:pointer;
}
.page{display:none;padding:20px;background:#222;border-radius:12px;margin-top:20px}
.page.show{display:block}
</style>
</head>
<body>

<h2>تست دکمه‌ها</h2>
<p>روی دکمه‌های زیر بزن</p>

<button onclick="test(1)">دکمه ۱ - خانه</button>
<button onclick="test(2)">دکمه ۲ - اصلی</button>
<button onclick="test(3)">دکمه ۳ - پرو</button>
<button onclick="test(4)">دکمه ۴ - بازی</button>
<button onclick="test(5)">دکمه ۵ - قیمت</button>
<button onclick="test(6)">دکمه ۶ - راهنما</button>

<div id="p1" class="page show">صفحه ۱ (خانه)</div>
<div id="p2" class="page">صفحه ۲ (اصلی)</div>
<div id="p3" class="page">صفحه ۳ (پرو)</div>
<div id="p4" class="page">صفحه ۴ (بازی)</div>
<div id="p5" class="page">صفحه ۵ (قیمت)</div>
<div id="p6" class="page">صفحه ۶ (راهنما)</div>

<script>
function test(n) {
  alert("دکمه " + n + " کار کرد ✅");

  // مخفی کردن همه صفحات
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove('show');
  }

  // نمایش صفحه مورد نظر
  var page = document.getElementById('p' + n);
  if (page) {
    page.classList.add('show');
  }
}
</script>
</body>
</html>
